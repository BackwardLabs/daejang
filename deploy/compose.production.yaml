name: daejang

x-runtime-hardening: &runtime-hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-resource-limits: &resource-limits
  deploy:
    resources:
      limits:
        cpus: "1.00"
        memory: 768M

services:
  nginx:
    image: ${NGINX_IMAGE_REF:?NGINX_IMAGE_REF must be a linux/arm64 digest reference}
    restart: unless-stopped
    <<: [*runtime-hardening, *resource-limits]
    user: "101:101"
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    volumes:
      - ./nginx/web-api.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ${NGINX_RUNTIME_CONFIG_PATH:?}:/run/config/nginx-runtime.conf:ro
      - ${NGINX_PERMISSION_SENTINEL_PATH:?}:/run/daejang/permission-sentinel:ro
    depends_on:
      web-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [proxy]

  web-api:
    image: ${WEB_API_IMAGE_REF:?WEB_API_IMAGE_REF must be a linux/arm64 digest reference}
    restart: unless-stopped
    <<: [*runtime-hardening, *resource-limits]
    user: "65532:65532"
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    env_file:
      - ${WEB_API_RUNTIME_ENV_FILE:?}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      DATABASE_URL: ${WEB_DATABASE_URL}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS}
      SIGNUP_SESSION_TTL_SECONDS: ${SIGNUP_SESSION_TTL_SECONDS}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES}
      RATE_LIMIT_HMAC_SECRET: ${RATE_LIMIT_HMAC_SECRET}
      TRUST_PROXY_HOPS: 1
      OAUTH_ENABLED_PROVIDERS: ${OAUTH_ENABLED_PROVIDERS}
      OAUTH_TRANSACTION_TTL_SECONDS: ${OAUTH_TRANSACTION_TTL_SECONDS}
      OAUTH_STATE_HMAC_SECRET: ${OAUTH_STATE_HMAC_SECRET}
      OAUTH_TRANSACTION_ENCRYPTION_KEY: ${OAUTH_TRANSACTION_ENCRYPTION_KEY}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_VERIFICATION_HMAC_SECRET: ${EMAIL_VERIFICATION_HMAC_SECRET}
      EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS}
      EMAIL_VERIFICATION_TOKEN_TTL_SECONDS: ${EMAIL_VERIFICATION_TOKEN_TTL_SECONDS}
      EMAIL_VERIFICATION_RESEND_AFTER_SECONDS: ${EMAIL_VERIFICATION_RESEND_AFTER_SECONDS}
      X402_REPORT_PAYMENTS_ENABLED: ${X402_REPORT_PAYMENTS_ENABLED:-false}
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-}
      X402_ASSET_ADDRESS: ${X402_ASSET_ADDRESS:-}
      X402_PAY_TO_ADDRESS: ${X402_PAY_TO_ADDRESS:-}
      X402_AMOUNT_ATOMIC: ${X402_AMOUNT_ATOMIC:-}
      X402_MAX_TIMEOUT_SECONDS: ${X402_MAX_TIMEOUT_SECONDS:-300}
      X402_TOKEN_NAME: ${X402_TOKEN_NAME:-Mock USD}
      X402_TOKEN_VERSION: ${X402_TOKEN_VERSION:-1}
      IDENTITY_VERIFICATION_MODE: ${IDENTITY_VERIFICATION_MODE:-disabled}
      UPBIT_PDF_IMPORT_ENABLED: ${UPBIT_PDF_IMPORT_ENABLED:-false}
      PRIVATE_OBJECT_ROOT: /var/lib/daejang/private
      PRIVATE_OBJECT_ENCRYPTION_KEY: ${PRIVATE_OBJECT_ENCRYPTION_KEY}
      PRIVATE_OBJECT_ENCRYPTION_KEY_ID: ${PRIVATE_OBJECT_ENCRYPTION_KEY_ID}
      PRIVATE_OBJECT_LEGACY_KEY_ID: ${PRIVATE_OBJECT_LEGACY_KEY_ID:-}
      PRIVATE_OBJECT_DECRYPTION_KEYS: ${PRIVATE_OBJECT_DECRYPTION_KEYS:-}
      ENGINE_GRPC_TARGET: engine:50051
      ENGINE_GRPC_SERVER_NAME: engine.internal
      ENGINE_GRPC_CA_PATH: /run/secrets/engine-ca.pem
      ENGINE_GRPC_CERT_PATH: /run/secrets/web-engine-client-cert.pem
      ENGINE_GRPC_KEY_PATH: /run/secrets/web-engine-client-key.pem
      PRIVATE_OBJECT_ROOT: /var/lib/daejang/private
    volumes:
      - private_objects:/var/lib/daejang/private
      - ${WEB_API_SECRET_DIR:?}:/run/secrets:ro
      - ${WEB_API_CONFIG_DIR:?}:/run/config:ro
      - ${WEB_API_PERMISSION_SENTINEL_PATH:?}:/run/daejang/permission-sentinel:ro
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [proxy, internal, database]

  engine:
    image: ${ENGINE_IMAGE_REF:?ENGINE_IMAGE_REF must be a linux/arm64 digest reference}
    restart: unless-stopped
    <<: [*runtime-hardening, *resource-limits]
    user: "65532:65532"
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    env_file:
      - ${ENGINE_RUNTIME_ENV_FILE:?}
    environment:
      ENGINE_LISTEN: 0.0.0.0:50051
      ENGINE_TLS_CERT_PATH: /run/secrets/engine-server-cert.pem
      ENGINE_TLS_KEY_PATH: /run/secrets/engine-server-key.pem
      ENGINE_TLS_CLIENT_CA_PATH: /run/secrets/engine-client-ca.pem
      ENGINE_HEALTH_CA_PATH: /run/secrets/engine-ca.pem
      ENGINE_HEALTH_CERT_PATH: /run/secrets/probe-client-cert.pem
      ENGINE_HEALTH_KEY_PATH: /run/secrets/probe-client-key.pem
      ENGINE_HEALTH_SERVER_NAME: engine.internal
      PRIVATE_OBJECT_ENCRYPTION_KEY: ${PRIVATE_OBJECT_ENCRYPTION_KEY}
      PRIVATE_OBJECT_ENCRYPTION_KEY_ID: ${PRIVATE_OBJECT_ENCRYPTION_KEY_ID}
      ENGINE_PDF_PARSER_SOCKET_PATH: /run/daejang/pdf-parser/parser.sock
    volumes:
      - ${ENGINE_SECRET_DIR:?}:/run/secrets:ro
      - ${ENGINE_CONFIG_DIR:?}:/run/config:ro
      - review_artifacts:/var/lib/daejang/review-artifacts
      - source_artifacts:/var/lib/daejang/source-artifacts
      - pdf_parser_socket:/run/daejang/pdf-parser:ro
      - ${ENGINE_PERMISSION_SENTINEL_PATH:?}:/run/daejang/permission-sentinel:ro
    depends_on:
      pdf-parser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/engine-healthcheck"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s
    networks: [internal, database]

  pdf-parser:
    image: ${PDF_PARSER_IMAGE_REF:?PDF_PARSER_IMAGE_REF must be a linux/arm64 digest reference}
    restart: unless-stopped
    <<: [*runtime-hardening, *resource-limits]
    user: "65532:65532"
    network_mode: none
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      - pdf_parser_socket:/run/daejang/pdf-parser
      - ${PDF_PARSER_PERMISSION_SENTINEL_PATH:?}:/run/daejang/permission-sentinel:ro
    healthcheck:
      test: ["CMD", "/opt/daejang-pdf-parser/bin/python", "-I", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect('/run/daejang/pdf-parser/parser.sock'); s.sendall(b'DJPING01'); s.shutdown(socket.SHUT_WR); r=s.makefile('rb'); assert r.read(8)==b'DJPONG01' and r.read(1)==b''"]
      interval: 15s
      timeout: 2s
      retries: 3
      start_period: 5s

  sync-worker:
    image: ${SYNC_WORKER_IMAGE_REF:?SYNC_WORKER_IMAGE_REF must be a linux/arm64 digest reference}
    entrypoint: ["/usr/local/bin/sync-worker"]
    restart: unless-stopped
    environment:
      DAEJANG_SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL}
      DAEJANG_PRIVATE_OBJECT_ROOT: /var/lib/daejang/private
      PRIVATE_OBJECT_ENCRYPTION_KEY: ${PRIVATE_OBJECT_ENCRYPTION_KEY}
      PRIVATE_OBJECT_ENCRYPTION_KEY_ID: ${PRIVATE_OBJECT_ENCRYPTION_KEY_ID}
      PRIVATE_OBJECT_LEGACY_KEY_ID: ${PRIVATE_OBJECT_LEGACY_KEY_ID:-}
      PRIVATE_OBJECT_DECRYPTION_KEYS: ${PRIVATE_OBJECT_DECRYPTION_KEYS:-}
      # jitd is deployed outside this Compose project on the private backend.
      # The mounted bridge config uses tcp:// plus the container TLS paths below.
      DAEJANG_JIT_BRIDGE_CONFIG: /run/config/jit-bridge.json
    <<: [*runtime-hardening, *resource-limits]
    user: "65532:65532"
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    env_file:
      - ${SYNC_WORKER_RUNTIME_ENV_FILE:?}
    volumes:
      - private_objects:/var/lib/daejang/private:ro
      - ${SYNC_WORKER_SECRET_DIR:?}:/run/secrets:ro
      - ${SYNC_WORKER_CONFIG_DIR:?}:/run/config:ro
      - ${SYNC_WORKER_PERMISSION_SENTINEL_PATH:?}:/run/daejang/permission-sentinel:ro
    networks: [internal, database]

  tax:
    image: ${TAX_IMAGE_REF:?TAX_IMAGE_REF must be a linux/arm64 digest reference}
    restart: unless-stopped
    <<: [*runtime-hardening, *resource-limits]
    user: "65532:65532"
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    env_file:
      - ${TAX_RUNTIME_ENV_FILE:?}
    environment:
      DAEJANG_TAXD_CLAIM_CONTROL_DIR: /run/config/claim-control
      DAEJANG_TAXD_CLAIM_CONTROL_STATE_DIR: /var/lib/daejang/tax-state
      DAEJANG_TAXD_CLAIM_RECEIPT_DIR: /var/lib/daejang/tax-receipts
      DAEJANG_TAXD_HEALTH_ADDRESS: 0.0.0.0:8080
    volumes:
      - ${TAX_SECRET_DIR:?}:/run/secrets:ro
      - ${TAX_CONFIG_DIR:?}:/run/config:ro
      - tax_state:/var/lib/daejang/tax-state
      - tax_receipts:/var/lib/daejang/tax-receipts
      - source_artifacts:/var/lib/daejang/source-artifacts:ro
      - review_artifacts:/var/lib/daejang/review-artifacts:ro
      - ${TAX_PERMISSION_SENTINEL_PATH:?}:/run/daejang/permission-sentinel:ro
    healthcheck:
      test: ["CMD", "/taxd", "healthcheck"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s
    networks: [internal, database]

networks:
  proxy:
    internal: true
  internal:
    internal: true
  database:
    external: true
    name: ${DAEJANG_DB_NETWORK:?}

volumes:
  private_objects: {}
  source_artifacts: {}
  review_artifacts: {}
  pdf_parser_socket: {}
  tax_state: {}
  tax_receipts: {}
