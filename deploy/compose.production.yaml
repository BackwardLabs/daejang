name: daejang
services:
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["${PUBLIC_TLS_PORT:-8443}:8443"]
    volumes:
      - ./nginx/web-api.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ${PUBLIC_TLS_CERT_PATH}:/run/secrets/public-tls-cert.pem:ro
      - ${PUBLIC_TLS_KEY_PATH}:/run/secrets/public-tls-key.pem:ro
    depends_on:
      web-api: { condition: service_healthy }
    networks: [edge]

  web-api:
    build: { context: .., dockerfile: apps/web-api/Dockerfile }
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      DATABASE_URL: ${WEB_DATABASE_URL}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS}
      SIGNUP_SESSION_TTL_SECONDS: ${SIGNUP_SESSION_TTL_SECONDS}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES}
      RATE_LIMIT_HMAC_SECRET: ${RATE_LIMIT_HMAC_SECRET}
      TRUST_PROXY_HOPS: 1
      OAUTH_ENABLED_PROVIDERS: ${OAUTH_ENABLED_PROVIDERS}
      OAUTH_TRANSACTION_TTL_SECONDS: ${OAUTH_TRANSACTION_TTL_SECONDS}
      OAUTH_STATE_HMAC_SECRET: ${OAUTH_STATE_HMAC_SECRET}
      OAUTH_TRANSACTION_ENCRYPTION_KEY: ${OAUTH_TRANSACTION_ENCRYPTION_KEY}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_VERIFICATION_HMAC_SECRET: ${EMAIL_VERIFICATION_HMAC_SECRET}
      EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS}
      EMAIL_VERIFICATION_TOKEN_TTL_SECONDS: ${EMAIL_VERIFICATION_TOKEN_TTL_SECONDS}
      EMAIL_VERIFICATION_RESEND_AFTER_SECONDS: ${EMAIL_VERIFICATION_RESEND_AFTER_SECONDS}
      X402_REPORT_PAYMENTS_ENABLED: ${X402_REPORT_PAYMENTS_ENABLED:-false}
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-}
      X402_ASSET_ADDRESS: ${X402_ASSET_ADDRESS:-}
      X402_PAY_TO_ADDRESS: ${X402_PAY_TO_ADDRESS:-}
      X402_AMOUNT_ATOMIC: ${X402_AMOUNT_ATOMIC:-}
      X402_MAX_TIMEOUT_SECONDS: ${X402_MAX_TIMEOUT_SECONDS:-300}
      X402_TOKEN_NAME: ${X402_TOKEN_NAME:-Mock USD}
      X402_TOKEN_VERSION: ${X402_TOKEN_VERSION:-1}
      X402_FACILITATOR_CA_PATH: /run/secrets/x402-ca.pem
      X402_FACILITATOR_CERT_PATH: /run/secrets/x402-client-cert.pem
      X402_FACILITATOR_KEY_PATH: /run/secrets/x402-client-key.pem
      X402_FACILITATOR_SERVER_NAME: x402-facilitator.internal
      GIWA_REPORT_ATTESTATIONS_ENABLED: ${GIWA_REPORT_ATTESTATIONS_ENABLED:-false}
      GIWA_REPORT_RPC_URL: ${GIWA_REPORT_RPC_URL:-}
      GIWA_REPORT_EAS_ADDRESS: ${GIWA_REPORT_EAS_ADDRESS:-}
      GIWA_REPORT_SCHEMA_REGISTRY_ADDRESS: ${GIWA_REPORT_SCHEMA_REGISTRY_ADDRESS:-}
      GIWA_REPORT_REGISTRY_PROXY_ADDRESS: ${GIWA_REPORT_REGISTRY_PROXY_ADDRESS:-}
      GIWA_REPORT_CONSUMER_ADDRESS: ${GIWA_REPORT_CONSUMER_ADDRESS:-}
      GIWA_REPORT_GOVERNANCE_SAFE_ADDRESS: ${GIWA_REPORT_GOVERNANCE_SAFE_ADDRESS:-}
      GIWA_REPORT_SCHEMA_UID: ${GIWA_REPORT_SCHEMA_UID:-}
      GIWA_REPORT_EVIDENCE_SCHEMA_DIGEST: ${GIWA_REPORT_EVIDENCE_SCHEMA_DIGEST:-}
      GIWA_REPORT_SYNTHETIC_TESTNET_ENABLED: ${GIWA_REPORT_SYNTHETIC_TESTNET_ENABLED:-false}
      GIWA_REPORT_IDENTITY_HMAC_KEY: ${GIWA_REPORT_IDENTITY_HMAC_KEY:-}
      GIWA_REPORT_ISSUER_ADDRESS: ${GIWA_REPORT_ISSUER_ADDRESS:-}
      GIWA_REPORT_ISSUER_KEYSTORE_PATH: ${GIWA_REPORT_ISSUER_KEYSTORE_PATH:-}
      GIWA_REPORT_ISSUER_PASSWORD_FILE: ${GIWA_REPORT_ISSUER_PASSWORD_FILE:-}
      GIWA_REPORT_REVIEWER_ADDRESS: ${GIWA_REPORT_REVIEWER_ADDRESS:-}
      GIWA_REPORT_REVIEWER_KEYSTORE_PATH: ${GIWA_REPORT_REVIEWER_KEYSTORE_PATH:-}
      GIWA_REPORT_REVIEWER_PASSWORD_FILE: ${GIWA_REPORT_REVIEWER_PASSWORD_FILE:-}
      GIWA_REPORT_MIN_CONFIRMATIONS: ${GIWA_REPORT_MIN_CONFIRMATIONS:-1}
      GIWA_REPORT_DAILY_USER_WRITE_LIMIT: ${GIWA_REPORT_DAILY_USER_WRITE_LIMIT:-4}
      GIWA_REPORT_DAILY_IP_WRITE_LIMIT: ${GIWA_REPORT_DAILY_IP_WRITE_LIMIT:-20}
      GIWA_REPORT_DAILY_GLOBAL_WRITE_LIMIT: ${GIWA_REPORT_DAILY_GLOBAL_WRITE_LIMIT:-100}
      IDENTITY_VERIFICATION_MODE: ${IDENTITY_VERIFICATION_MODE:-disabled}
      UPBIT_PDF_IMPORT_ENABLED: ${UPBIT_PDF_IMPORT_ENABLED:-false}
      PRIVATE_OBJECT_ROOT: /var/lib/daejang/private
      PRIVATE_OBJECT_ENCRYPTION_KEY: ${PRIVATE_OBJECT_ENCRYPTION_KEY}
      PRIVATE_OBJECT_ENCRYPTION_KEY_ID: ${PRIVATE_OBJECT_ENCRYPTION_KEY_ID}
      PRIVATE_OBJECT_LEGACY_KEY_ID: ${PRIVATE_OBJECT_LEGACY_KEY_ID:-}
      PRIVATE_OBJECT_DECRYPTION_KEYS: ${PRIVATE_OBJECT_DECRYPTION_KEYS:-}
      ENGINE_GRPC_TARGET: engine:50051
      ENGINE_GRPC_SERVER_NAME: engine.internal
      ENGINE_GRPC_CA_PATH: /run/secrets/engine-ca.pem
      ENGINE_GRPC_CERT_PATH: /run/secrets/web-engine-client-cert.pem
      ENGINE_GRPC_KEY_PATH: /run/secrets/web-engine-client-key.pem
    volumes:
      - private_objects:/var/lib/daejang/private
      - ${GIWA_REPORT_SECRETS_DIR:-./disabled-secrets}:/run/secrets/giwa-report:ro
      - ${ENGINE_CA_PATH}:/run/secrets/engine-ca.pem:ro
      - ${WEB_ENGINE_CLIENT_CERT_PATH}:/run/secrets/web-engine-client-cert.pem:ro
      - ${WEB_ENGINE_CLIENT_KEY_PATH}:/run/secrets/web-engine-client-key.pem:ro
    depends_on:
      engine: { condition: service_started }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [edge, backend, database]

  engine:
    build:
      context: ..
      dockerfile: services/engine/Dockerfile
      target: engine-runtime
      secrets: [github_token]
    restart: unless-stopped
    environment:
      ENGINE_LISTEN: 0.0.0.0:50051
      DAEJANG_SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL}
      DAEJANG_SOURCE_ARTIFACT_DATABASE_URL: ${SOURCE_ARTIFACT_DATABASE_URL}
      DAEJANG_SOURCE_ARTIFACT_ROOT: /var/lib/daejang/source-artifacts/objects
      DAEJANG_SOURCE_ARTIFACT_TEMP: /var/lib/daejang/source-artifacts/tmp
      DAEJANG_QUERY_DATABASE_URL: ${QUERY_DATABASE_URL}
      DAEJANG_REPORT_DATABASE_URL: ${REPORT_DATABASE_URL}
      DAEJANG_REVIEW_DATABASE_URL: ${REVIEW_DATABASE_URL}
      DAEJANG_REVIEW_ARTIFACT_DATABASE_URL: ${REVIEW_ARTIFACT_DATABASE_URL}
      DAEJANG_REVIEW_ARTIFACT_ROOT: ${REVIEW_ARTIFACT_ROOT:-}
      DAEJANG_REVIEW_ARTIFACT_TEMP: ${REVIEW_ARTIFACT_TEMP:-}
      ENGINE_TLS_CERT_PATH: /run/secrets/engine-server-cert.pem
      ENGINE_TLS_KEY_PATH: /run/secrets/engine-server-key.pem
      ENGINE_TLS_CLIENT_CA_PATH: /run/secrets/engine-client-ca.pem
      ENGINE_WEB_API_CLIENT_DNS_NAME: ${ENGINE_WEB_API_CLIENT_DNS_NAME}
      ENGINE_PDF_PARSER_SOCKET_PATH: /run/daejang/pdf-parser/parser.sock
      ENGINE_HEALTH_CA_PATH: /run/secrets/engine-ca.pem
      ENGINE_HEALTH_CERT_PATH: /run/secrets/probe-client-cert.pem
      ENGINE_HEALTH_KEY_PATH: /run/secrets/probe-client-key.pem
      ENGINE_HEALTH_SERVER_NAME: engine.internal
      PRIVATE_OBJECT_ENCRYPTION_KEY: ${PRIVATE_OBJECT_ENCRYPTION_KEY}
      PRIVATE_OBJECT_ENCRYPTION_KEY_ID: ${PRIVATE_OBJECT_ENCRYPTION_KEY_ID}
    volumes:
      - ${ENGINE_SERVER_CERT_PATH}:/run/secrets/engine-server-cert.pem:ro
      - ${ENGINE_SERVER_KEY_PATH}:/run/secrets/engine-server-key.pem:ro
      - ${ENGINE_CLIENT_CA_PATH}:/run/secrets/engine-client-ca.pem:ro
      - ${ENGINE_CA_PATH}:/run/secrets/engine-ca.pem:ro
      - ${ENGINE_PROBE_CERT_PATH}:/run/secrets/probe-client-cert.pem:ro
      - ${ENGINE_PROBE_KEY_PATH}:/run/secrets/probe-client-key.pem:ro
      - review_artifacts:/var/lib/daejang/review-artifacts
      - source_artifacts:/var/lib/daejang/source-artifacts
      - pdf_parser_socket:/run/daejang/pdf-parser:ro
    depends_on:
      pdf-parser: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/engine-healthcheck"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s
    networks: [backend, database]

  pdf-parser:
    build:
      context: ..
      dockerfile: services/engine/Dockerfile
      target: parser-runtime
      secrets: [github_token]
    restart: unless-stopped
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 8
    mem_limit: 768m
    cpus: 1.0
    volumes:
      - pdf_parser_socket:/run/daejang/pdf-parser
    healthcheck:
      test:
        - CMD
        - /opt/daejang-pdf-parser/bin/python
        - -I
        - -c
        - "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect('/run/daejang/pdf-parser/parser.sock'); s.sendall(b'DJPING01'); s.shutdown(socket.SHUT_WR); r=s.makefile('rb'); assert r.read(8)==b'DJPONG01' and r.read(1)==b''"
      interval: 15s
      timeout: 2s
      retries: 3
      start_period: 5s

  sync-worker:
    build:
      context: ..
      dockerfile: services/engine/Dockerfile
      target: engine-runtime
      secrets: [github_token]
    entrypoint: ["/usr/local/bin/sync-worker"]
    restart: unless-stopped
    environment:
      DAEJANG_SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL}
      DAEJANG_PRIVATE_OBJECT_ROOT: /var/lib/daejang/private
      PRIVATE_OBJECT_ENCRYPTION_KEY: ${PRIVATE_OBJECT_ENCRYPTION_KEY}
      PRIVATE_OBJECT_ENCRYPTION_KEY_ID: ${PRIVATE_OBJECT_ENCRYPTION_KEY_ID}
      PRIVATE_OBJECT_LEGACY_KEY_ID: ${PRIVATE_OBJECT_LEGACY_KEY_ID:-}
      PRIVATE_OBJECT_DECRYPTION_KEYS: ${PRIVATE_OBJECT_DECRYPTION_KEYS:-}
      # jitd is deployed outside this Compose project on the private backend.
      # The mounted bridge config uses tcp:// plus the container TLS paths below.
      DAEJANG_JIT_BRIDGE_CONFIG: /run/config/jit-bridge.json
    volumes:
      - private_objects:/var/lib/daejang/private:ro
      - ${JIT_BRIDGE_CONFIG_PATH}:/run/config/jit-bridge.json:ro
      - ${JIT_BRIDGE_CA_PATH}:/run/secrets/jit-ca.pem:ro
      - ${JIT_BRIDGE_CLIENT_CERT_PATH}:/run/secrets/jit-client-cert.pem:ro
      - ${JIT_BRIDGE_CLIENT_KEY_PATH}:/run/secrets/jit-client-key.pem:ro
    networks: [backend, database]

networks:
  edge: {}
  backend: {}
  database:
    external: true
    name: ${DAEJANG_DB_NETWORK:-daejang-db_default}
volumes:
  private_objects: {}
  source_artifacts: {}
  review_artifacts: {}
  pdf_parser_socket: {}
secrets:
  github_token:
    environment: GH_PAT
