name: daejang-dev-e2e

services:
  socket-init:
    image: ${DAEJANG_PDF_PARSER_CANDIDATE_IMAGE}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 65532:65532 /run/daejang/pdf-parser /run/daejang/engine"]
    network_mode: none
    volumes:
      - pdf_parser_socket:/run/daejang/pdf-parser
      - engine_socket:/run/daejang/engine

  pdf-parser:
    image: ${DAEJANG_PDF_PARSER_CANDIDATE_IMAGE}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 8
    volumes:
      - pdf_parser_socket:/run/daejang/pdf-parser
    depends_on:
      socket-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - /opt/daejang-pdf-parser/bin/python
        - -I
        - -c
        - "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect('/run/daejang/pdf-parser/parser.sock'); s.sendall(b'DJPING01'); s.shutdown(socket.SHUT_WR); r=s.makefile('rb'); assert r.read(8)==b'DJPONG01' and r.read(1)==b''"
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  engine:
    image: ${DAEJANG_ENGINE_CANDIDATE_IMAGE}
    environment:
      ENGINE_LISTEN: unix:///run/daejang/engine/engine.sock
      DAEJANG_SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL}
      DAEJANG_SOURCE_ARTIFACT_DATABASE_URL: ${SOURCE_ARTIFACT_DATABASE_URL}
      DAEJANG_SOURCE_ARTIFACT_ROOT: /var/lib/daejang/artifacts
      DAEJANG_SOURCE_ARTIFACT_TEMP: /var/lib/daejang/artifacts.tmp
      DAEJANG_QUERY_DATABASE_URL: ${QUERY_DATABASE_URL}
      DAEJANG_REPORT_DATABASE_URL: ${REPORT_DATABASE_URL}
      DAEJANG_REVIEW_DATABASE_URL: ${EVENT_DATABASE_URL}
      DAEJANG_REVIEW_ARTIFACT_DATABASE_URL: ${SOURCE_ARTIFACT_DATABASE_URL}
      DAEJANG_REVIEW_ARTIFACT_ROOT: /var/lib/daejang/artifacts
      DAEJANG_REVIEW_ARTIFACT_TEMP: /var/lib/daejang/artifacts.tmp
      DAEJANG_TAX_ARTIFACT_DATABASE_URL: ${TAX_DATABASE_URL}
      DAEJANG_TAX_ARTIFACT_ROOT: /var/lib/daejang/artifacts
      DAEJANG_TAX_ARTIFACT_TEMP: /var/lib/daejang/artifacts.tmp
      ENGINE_PDF_PARSER_SOCKET_PATH: /run/daejang/pdf-parser/parser.sock
      ENGINE_PDF_PARSER_TIMEOUT: 20s
      ENGINE_PDF_IMPORT_LEASE_DURATION: 2m
      PRIVATE_OBJECT_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      PRIVATE_OBJECT_ENCRYPTION_KEY_ID: dev-e2e-only
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - pdf_parser_socket:/run/daejang/pdf-parser:ro
      - engine_socket:/run/daejang/engine
      - pipeline_artifacts:/var/lib/daejang
    depends_on:
      pdf-parser: { condition: service_healthy }

  pipeline-permissions:
    image: alpine:3.23
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 65532:65532 /e2e /var/lib/daejang"]
    network_mode: none
    volumes:
      - pipeline_state:/e2e
      - pipeline_artifacts:/var/lib/daejang

  pipeline-fixture:
    image: ${DAEJANG_TAX_DEV_E2E_IMAGE}
    environment:
      DAEJANG_TAX_DEV_E2E_MODE: prepare
      DAEJANG_TAX_DEV_E2E_DATABASE_URL: ${OWNER_DATABASE_URL}
      DAEJANG_TAX_DEV_E2E_STATE_DIR: /e2e
      DAEJANG_TAX_DEV_E2E_ARTIFACT_ROOT: /var/lib/daejang/artifacts
      DAEJANG_TAX_DEV_E2E_ARTIFACT_TEMP: /var/lib/daejang/artifacts.tmp
      DAEJANG_TAX_DEV_E2E_SUFFIX: ${DAEJANG_E2E_SUFFIX}
      DAEJANG_TAX_DEV_E2E_TAX_YEAR: "2025"
      DAEJANG_E2E_SUBJECT_ID: ${DAEJANG_E2E_SUBJECT_ID}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - pipeline_state:/e2e
      - pipeline_artifacts:/var/lib/daejang

  posting-worker:
    image: ${DAEJANG_POSTING_IMAGE}
    command:
      - --artifact-root
      - /var/lib/daejang/artifacts
      - --artifact-temp
      - /var/lib/daejang/artifacts.tmp
      - --service-root
      - /app
      - --claim-policy
      - /e2e/source-publication-claim-policy.json
      - --poll-interval
      - 250ms
    environment:
      DAEJANG_POSTING_DATABASE_URL: ${EVENT_DATABASE_URL}
      DAEJANG_POSTING_ARTIFACT_DATABASE_URL: ${SOURCE_ARTIFACT_DATABASE_URL}
      DAEJANG_PUBLICATION_POLICY_TRUST_KEY: ${PUBLICATION_TRUST_KEY}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - pipeline_state:/e2e:ro
      - pipeline_artifacts:/var/lib/daejang

  tax-engine:
    image: ${DAEJANG_TAX_ENGINE_IMAGE}
    environment:
      DAEJANG_DATABASE_URL: ${TAX_DATABASE_URL}
      DAEJANG_ARTIFACT_ROOT: /var/lib/daejang/artifacts
      DAEJANG_ARTIFACT_TEMP: /var/lib/daejang/artifacts.tmp
      DAEJANG_TAXD_INPUT_MODE: LEDGER_PUBLICATION
      DAEJANG_TAXD_POLICY_FILE: /e2e/interpretation-policy.json
      DAEJANG_TAXD_OWNERSHIP_FILE: /e2e/ownership.json
      DAEJANG_TAXD_ACTIVATION_SET_FILE: /e2e/activation-set.json
      DAEJANG_TAXD_ACTIVATION_SET_SHA256: ${ACTIVATION_SHA256}
      DAEJANG_TAXD_DOWNSTREAM_PROFILE_FILE: /e2e/downstream-profiles.json
      DAEJANG_TAXD_TAX_POLICY_FILE: /e2e/tax-policy.json
      DAEJANG_TAXD_QUOTE_SNAPSHOT_FILE: /e2e/quotes.json
      # taxd의 공통 설정이 요구하는 32-byte 키다. LEDGER_PUBLICATION dev E2E에서는
      # legacy evidence claim controller를 사용하지 않으므로 테스트 전용 고정값을 쓴다.
      DAEJANG_TAXD_PUBLICATION_POLICY_TRUST_KEY: "dev-e2e-tax-publication-key-0000"
      DAEJANG_TAXD_CANDIDATE_DIGEST: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      DAEJANG_TAXD_PRODUCER_VERSION: dev-e2e
      DAEJANG_TAXD_SCHEMA_COMMIT: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DAEJANG_TAXD_JIT_COMMIT: cccccccccccccccccccccccccccccccccccccccc
      DAEJANG_TAXD_DB_COMMIT: dddddddddddddddddddddddddddddddddddddddd
      DAEJANG_TAXD_DB_MIGRATION_VERSION: ${DAEJANG_TAXD_DB_MIGRATION_VERSION}
      DAEJANG_TAXD_TAX_COMMIT: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      DAEJANG_TAXD_CATALOG_SHA256: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
      DAEJANG_TAXD_HEALTH_ADDRESS: 0.0.0.0:8080
      DAEJANG_TAXD_POLL_INTERVAL: 100ms
      DAEJANG_TAXD_LEASE_DURATION: 30s
      DAEJANG_TAXD_RETRY_DELAY: 100ms
      REVIEWROOM_INTERNAL_API_URL: ${REVIEWROOM_INTERNAL_API_URL}
      REVIEWROOM_APPLICATION_RECEIPT_TOKEN: ${REVIEWROOM_APPLICATION_RECEIPT_TOKEN}
      REVIEWROOM_APPLICATION_RECEIPT_HTTP_TIMEOUT: ${REVIEWROOM_APPLICATION_RECEIPT_HTTP_TIMEOUT}
      REVIEWROOM_DELIVERY_ALLOW_INSECURE_HTTP: ${REVIEWROOM_DELIVERY_ALLOW_INSECURE_HTTP}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - pipeline_state:/e2e:ro
      - pipeline_artifacts:/var/lib/daejang
    healthcheck:
      test: ["CMD", "/taxd", "healthcheck"]
      interval: 1s
      timeout: 2s
      retries: 30

  pipeline-verify:
    image: ${DAEJANG_TAX_DEV_E2E_IMAGE}
    environment:
      DAEJANG_TAX_DEV_E2E_MODE: verify
      DAEJANG_TAX_DEV_E2E_DATABASE_URL: ${TAX_DATABASE_URL}
      DAEJANG_TAX_DEV_E2E_STATE_DIR: /e2e
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - pipeline_state:/e2e:ro
    depends_on:
      tax-engine: { condition: service_healthy }

  web-api-tests:
    image: ${DAEJANG_WEB_API_TEST_IMAGE}
    working_dir: /app
    command:
      - /bin/sh
      - -ec
      - |
        npm run test --workspace @daejang/web-api -- src/sources/source-pipeline.e2e.test.ts
        exec npm run test --workspace @daejang/web-api -- src/reviews/review-resolution.e2e.test.ts
    environment:
      RUN_SOURCE_PIPELINE_E2E_TESTS: "1"
      RUN_REVIEW_RESOLUTION_E2E_TESTS: ${RUN_REVIEW_RESOLUTION_E2E_TESTS}
      ALLOW_DOCKER_HOST_E2E: "1"
      DAEJANG_E2E_SUBJECT_ID: ${DAEJANG_E2E_SUBJECT_ID}
      TEST_DATABASE_URL: ${OWNER_DATABASE_URL}
      TEST_WEB_DATABASE_URL: ${WEB_DATABASE_URL}
      TEST_ENGINE_GRPC_TARGET: unix:/run/daejang/engine/engine.sock
      REVIEWROOM_INTERNAL_API_URL: ${REVIEWROOM_INTERNAL_API_URL}
      REVIEWROOM_PROOF_VECTOR_TOKEN: ${REVIEWROOM_PROOF_VECTOR_TOKEN}
      REVIEW_E2E_ANCHOR_CHAIN_ID: ${REVIEW_E2E_ANCHOR_CHAIN_ID}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - engine_socket:/run/daejang/engine:ro
    depends_on:
      engine: { condition: service_started }

  web-api:
    image: ${DAEJANG_WEB_API_CANDIDATE_IMAGE}
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: http://localhost:${DAEJANG_DEV_E2E_WEB_PORT}
      DATABASE_URL: ${WEB_DATABASE_URL}
      RATE_LIMIT_HMAC_SECRET: dev-e2e-rate-limit-secret-only
      SIGNUP_ENABLED: "true"
      EMAIL_AUTH_ENABLED: "true"
      EMAIL_VERIFICATION_DEV_CODE: "000000"
      REPORTS_UI_MODE: product
      UPBIT_PDF_IMPORT_ENABLED: "true"
      ENGINE_GRPC_INSECURE_TARGET: unix:/run/daejang/engine/engine.sock
      PRIVATE_OBJECT_ROOT: /var/lib/daejang/private
      PRIVATE_OBJECT_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      PRIVATE_OBJECT_ENCRYPTION_KEY_ID: dev-e2e-only
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      - engine_socket:/run/daejang/engine:ro
      - private_objects:/var/lib/daejang/private
    depends_on:
      engine: { condition: service_started }

  web-ui:
    image: ${DAEJANG_WEB_UI_CANDIDATE_IMAGE}
    environment:
      VITE_API_PROXY_TARGET: http://web-api:3000
    ports:
      - 127.0.0.1:${DAEJANG_DEV_E2E_WEB_PORT}:5173
    depends_on:
      web-api: { condition: service_healthy }

  # ── ReviewRoom (일회용 체인 포함 풀 사이클) ────────────────────────────────
  # production 과 같은 image·워크로드로 "확정 → 적용 → 영수증 → 온체인 앵커"
  # 전체를 로컬에서 돌린다. 실제 배포된 컨트랙트에는 절대 쓰지 않는다 —
  # 일회용 anvil 체인에 ReviewProofRegistryV2 를 새로 배포해 그쪽으로만 쓴다.
  reviewroom-chain:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    # --block-time 1: proof vector 확인 수가 실체인처럼 자라도록 매초 블록 생성
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1", "--silent"]
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 2s
      retries: 30

  reviewroom-registry:
    image: ghcr.io/foundry-rs/foundry:latest
    # 볼륨에 chain env 를 쓰기 위해 root 로 돈다 (dev 전용 일회성 부트스트랩).
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    # anvil 기본 계정 0 의 사전 공개 개발용 키다. 일회용 체인 밖에서는 무의미하다.
    command:
      - |
        set -e
        cp -r /contracts /tmp/contracts && cd /tmp/contracts
        forge build --out out --cache-path cache >/dev/null 2>&1
        key=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
        address=$$(forge create --rpc-url http://reviewroom-chain:8545 \
          --private-key "$$key" --broadcast --json \
          src/ReviewProofRegistryV2.sol:ReviewProofRegistryV2 \
          --constructor-args 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266 | \
          grep -oE '"deployedTo": *"0x[0-9a-fA-F]+"' | grep -oE '0x[0-9a-fA-F]+')
        test -n "$$address"
        cast send --rpc-url http://reviewroom-chain:8545 --private-key "$$key" \
          "$$address" 'setAttester(address,bool)' \
          0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266 true >/dev/null
        code_hash=$$(cast keccak "$$(cast code --rpc-url http://reviewroom-chain:8545 "$$address")")
        {
          printf 'CHAIN_ID=31337\n'
          printf 'CHAIN_RPC_URL=http://reviewroom-chain:8545\n'
          printf 'REVIEW_PROOF_REGISTRY_ADDRESS=%s\n' "$$address"
          printf 'REVIEW_PROOF_REGISTRY_CODE_HASH=%s\n' "$$code_hash"
          printf 'REVIEW_PROOF_REGISTRY_DEPLOYMENT_ID=dev-e2e-anvil\n'
          printf 'ANCHOR_PRIVATE_KEY=%s\n' "$$key"
        } > /chain/env
        chmod 644 /chain/env
        echo "registry deployed: $$address"
    volumes:
      - ${DAEJANG_REVIEWROOM_DIR:-../daejang-reviewroom}/contracts:/contracts:ro
      - reviewroom_chain_env:/chain
    depends_on:
      reviewroom-chain: { condition: service_healthy }

  reviewroom-postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: reviewroom
      POSTGRES_USER: reviewroom
      POSTGRES_PASSWORD: dev-e2e-reviewroom-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewroom -d reviewroom"]
      interval: 2s
      timeout: 2s
      retries: 30

  reviewroom-migrate:
    image: ${DAEJANG_REVIEWROOM_IMAGE:-backwardlabss-mac-studio.tail344fa1.ts.net/daejang/reviewroom:latest}
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      DATABASE_URL: postgresql://reviewroom:dev-e2e-reviewroom-only@reviewroom-postgres:5432/reviewroom
    depends_on:
      reviewroom-postgres: { condition: service_healthy }

  reviewroom-api:
    image: ${DAEJANG_REVIEWROOM_IMAGE:-backwardlabss-mac-studio.tail344fa1.ts.net/daejang/reviewroom:latest}
    entrypoint: ["/bin/sh", "-c"]
    command: ["set -a && . /chain/env && set +a && exec node dist/src/index.js"]
    environment:
      DATABASE_URL: postgresql://reviewroom:dev-e2e-reviewroom-only@reviewroom-postgres:5432/reviewroom
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8081"
      INTERNAL_API_TOKEN: ${REVIEWROOM_INTERNAL_API_TOKEN}
      RESOLUTION_INGEST_API_TOKEN: ${REVIEWROOM_RESOLUTION_INGEST_TOKEN}
      APPLICATION_RECEIPT_API_TOKEN: ${REVIEWROOM_APPLICATION_RECEIPT_TOKEN}
      PROOF_VECTOR_API_TOKEN: ${REVIEWROOM_PROOF_VECTOR_TOKEN}
      REVIEW_COMMITMENT_KEY_BASE64: ${REVIEWROOM_COMMITMENT_KEY_BASE64}
    volumes:
      - reviewroom_chain_env:/chain:ro
    depends_on:
      reviewroom-migrate: { condition: service_completed_successfully }
      reviewroom-registry: { condition: service_completed_successfully }

  reviewroom-anchor:
    image: ${DAEJANG_REVIEWROOM_IMAGE:-backwardlabss-mac-studio.tail344fa1.ts.net/daejang/reviewroom:latest}
    entrypoint: ["/bin/sh", "-c"]
    command: ["set -a && . /chain/env && set +a && exec node dist/src/worker.js"]
    environment:
      DATABASE_URL: postgresql://reviewroom:dev-e2e-reviewroom-only@reviewroom-postgres:5432/reviewroom
      ANCHOR_CONFIRMATIONS: "1"
      ANCHOR_POLL_INTERVAL_MS: "500"
    # image healthcheck 는 API endpoint 를 찌른다. worker 는 서빙하지 않는다.
    healthcheck:
      disable: true
    volumes:
      - reviewroom_chain_env:/chain:ro
    depends_on:
      reviewroom-api: { condition: service_started }

  reviewroom-delivery:
    image: ${DAEJANG_REVIEWROOM_IMAGE:-backwardlabss-mac-studio.tail344fa1.ts.net/daejang/reviewroom:latest}
    command: ["node", "dist/src/deliveryWorker.js"]
    environment:
      DAEJANG_DATABASE_URL: ${OWNER_DATABASE_URL}
      REVIEWROOM_INTERNAL_API_URL: http://reviewroom-api:8081
      REVIEWROOM_RESOLUTION_INGEST_TOKEN: ${REVIEWROOM_RESOLUTION_INGEST_TOKEN}
      REVIEWROOM_DELIVERY_ALLOW_INSECURE_HTTP: "true"
      REVIEWROOM_DELIVERY_POLL_INTERVAL_MS: "500"
    healthcheck:
      disable: true
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      reviewroom-api: { condition: service_started }

volumes:
  reviewroom_chain_env: {}
  pdf_parser_socket: {}
  engine_socket: {}
  private_objects: {}
  pipeline_artifacts: {}
  pipeline_state: {}
