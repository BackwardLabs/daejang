name: daejang-dev-e2e

services:
  socket-init:
    image: ${DAEJANG_PDF_PARSER_CANDIDATE_IMAGE}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 65532:65532 /run/daejang/pdf-parser /run/daejang/engine"]
    network_mode: none
    volumes:
      - pdf_parser_socket:/run/daejang/pdf-parser
      - engine_socket:/run/daejang/engine

  pdf-parser:
    image: ${DAEJANG_PDF_PARSER_CANDIDATE_IMAGE}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 8
    volumes:
      - pdf_parser_socket:/run/daejang/pdf-parser
    depends_on:
      socket-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - /opt/daejang-pdf-parser/bin/python
        - -I
        - -c
        - "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect('/run/daejang/pdf-parser/parser.sock'); s.sendall(b'DJPING01'); s.shutdown(socket.SHUT_WR); r=s.makefile('rb'); assert r.read(8)==b'DJPONG01' and r.read(1)==b''"
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  engine:
    image: ${DAEJANG_ENGINE_CANDIDATE_IMAGE}
    environment:
      ENGINE_LISTEN: unix:///run/daejang/engine/engine.sock
      DAEJANG_SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL}
      DAEJANG_SOURCE_ARTIFACT_DATABASE_URL: ${SOURCE_ARTIFACT_DATABASE_URL}
      DAEJANG_SOURCE_ARTIFACT_ROOT: /var/lib/daejang/artifacts
      DAEJANG_SOURCE_ARTIFACT_TEMP: /var/lib/daejang/artifacts.tmp
      DAEJANG_QUERY_DATABASE_URL: ${QUERY_DATABASE_URL}
      DAEJANG_REPORT_DATABASE_URL: ${REPORT_DATABASE_URL}
      DAEJANG_REVIEW_DATABASE_URL: ${EVENT_DATABASE_URL}
      DAEJANG_REVIEW_ARTIFACT_DATABASE_URL: ${SOURCE_ARTIFACT_DATABASE_URL}
      DAEJANG_REVIEW_ARTIFACT_ROOT: /var/lib/daejang/artifacts
      DAEJANG_REVIEW_ARTIFACT_TEMP: /var/lib/daejang/artifacts.tmp
      DAEJANG_TAX_ARTIFACT_DATABASE_URL: ${TAX_DATABASE_URL}
      DAEJANG_TAX_ARTIFACT_ROOT: /var/lib/daejang/artifacts
      DAEJANG_TAX_ARTIFACT_TEMP: /var/lib/daejang/artifacts.tmp
      ENGINE_PDF_PARSER_SOCKET_PATH: /run/daejang/pdf-parser/parser.sock
      ENGINE_PDF_PARSER_TIMEOUT: 20s
      ENGINE_PDF_IMPORT_LEASE_DURATION: 2m
      PRIVATE_OBJECT_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      PRIVATE_OBJECT_ENCRYPTION_KEY_ID: dev-e2e-only
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - pdf_parser_socket:/run/daejang/pdf-parser:ro
      - engine_socket:/run/daejang/engine
      - pipeline_artifacts:/var/lib/daejang
    depends_on:
      pdf-parser: { condition: service_healthy }

  pipeline-permissions:
    image: alpine:3.23
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 65532:65532 /e2e /var/lib/daejang"]
    network_mode: none
    volumes:
      - pipeline_state:/e2e
      - pipeline_artifacts:/var/lib/daejang

  pipeline-fixture:
    image: ${DAEJANG_TAX_DEV_E2E_IMAGE}
    environment:
      DAEJANG_TAX_DEV_E2E_MODE: prepare
      DAEJANG_TAX_DEV_E2E_DATABASE_URL: ${OWNER_DATABASE_URL}
      DAEJANG_TAX_DEV_E2E_STATE_DIR: /e2e
      DAEJANG_TAX_DEV_E2E_ARTIFACT_ROOT: /var/lib/daejang/artifacts
      DAEJANG_TAX_DEV_E2E_ARTIFACT_TEMP: /var/lib/daejang/artifacts.tmp
      DAEJANG_TAX_DEV_E2E_SUFFIX: ${DAEJANG_E2E_SUFFIX}
      DAEJANG_TAX_DEV_E2E_TAX_YEAR: "2025"
      DAEJANG_E2E_SUBJECT_ID: ${DAEJANG_E2E_SUBJECT_ID}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - pipeline_state:/e2e
      - pipeline_artifacts:/var/lib/daejang

  posting-worker:
    image: ${DAEJANG_POSTING_IMAGE}
    command:
      - --artifact-root
      - /var/lib/daejang/artifacts
      - --artifact-temp
      - /var/lib/daejang/artifacts.tmp
      - --service-root
      - /app
      - --claim-policy
      - /e2e/source-publication-claim-policy.json
      - --poll-interval
      - 250ms
    environment:
      DAEJANG_POSTING_DATABASE_URL: ${EVENT_DATABASE_URL}
      DAEJANG_POSTING_ARTIFACT_DATABASE_URL: ${SOURCE_ARTIFACT_DATABASE_URL}
      DAEJANG_PUBLICATION_POLICY_TRUST_KEY: ${PUBLICATION_TRUST_KEY}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - pipeline_state:/e2e:ro
      - pipeline_artifacts:/var/lib/daejang

  tax-engine:
    image: ${DAEJANG_TAX_ENGINE_IMAGE}
    environment:
      DAEJANG_DATABASE_URL: ${TAX_DATABASE_URL}
      DAEJANG_ARTIFACT_ROOT: /var/lib/daejang/artifacts
      DAEJANG_ARTIFACT_TEMP: /var/lib/daejang/artifacts.tmp
      DAEJANG_TAXD_INPUT_MODE: LEDGER_PUBLICATION
      DAEJANG_TAXD_POLICY_FILE: /e2e/interpretation-policy.json
      DAEJANG_TAXD_OWNERSHIP_FILE: /e2e/ownership.json
      DAEJANG_TAXD_ACTIVATION_SET_FILE: /e2e/activation-set.json
      DAEJANG_TAXD_ACTIVATION_SET_SHA256: ${ACTIVATION_SHA256}
      DAEJANG_TAXD_DOWNSTREAM_PROFILE_FILE: /e2e/downstream-profiles.json
      DAEJANG_TAXD_TAX_POLICY_FILE: /e2e/tax-policy.json
      DAEJANG_TAXD_QUOTE_SNAPSHOT_FILE: /e2e/quotes.json
      # taxd의 공통 설정이 요구하는 32-byte 키다. LEDGER_PUBLICATION dev E2E에서는
      # legacy evidence claim controller를 사용하지 않으므로 테스트 전용 고정값을 쓴다.
      DAEJANG_TAXD_PUBLICATION_POLICY_TRUST_KEY: "dev-e2e-tax-publication-key-0000"
      DAEJANG_TAXD_CANDIDATE_DIGEST: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      DAEJANG_TAXD_PRODUCER_VERSION: dev-e2e
      DAEJANG_TAXD_SCHEMA_COMMIT: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DAEJANG_TAXD_JIT_COMMIT: cccccccccccccccccccccccccccccccccccccccc
      DAEJANG_TAXD_DB_COMMIT: dddddddddddddddddddddddddddddddddddddddd
      DAEJANG_TAXD_DB_MIGRATION_VERSION: ${DAEJANG_TAXD_DB_MIGRATION_VERSION}
      DAEJANG_TAXD_TAX_COMMIT: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      DAEJANG_TAXD_CATALOG_SHA256: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
      DAEJANG_TAXD_HEALTH_ADDRESS: 0.0.0.0:8080
      DAEJANG_TAXD_POLL_INTERVAL: 100ms
      DAEJANG_TAXD_LEASE_DURATION: 30s
      DAEJANG_TAXD_RETRY_DELAY: 100ms
      REVIEWROOM_INTERNAL_API_URL: ${REVIEWROOM_INTERNAL_API_URL}
      REVIEWROOM_APPLICATION_RECEIPT_TOKEN: ${REVIEWROOM_APPLICATION_RECEIPT_TOKEN}
      REVIEWROOM_APPLICATION_RECEIPT_HTTP_TIMEOUT: ${REVIEWROOM_APPLICATION_RECEIPT_HTTP_TIMEOUT}
      REVIEWROOM_DELIVERY_ALLOW_INSECURE_HTTP: ${REVIEWROOM_DELIVERY_ALLOW_INSECURE_HTTP}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - pipeline_state:/e2e:ro
      - pipeline_artifacts:/var/lib/daejang
    healthcheck:
      test: ["CMD", "/taxd", "healthcheck"]
      interval: 1s
      timeout: 2s
      retries: 30

  pipeline-verify:
    image: ${DAEJANG_TAX_DEV_E2E_IMAGE}
    environment:
      DAEJANG_TAX_DEV_E2E_MODE: verify
      DAEJANG_TAX_DEV_E2E_DATABASE_URL: ${TAX_DATABASE_URL}
      DAEJANG_TAX_DEV_E2E_STATE_DIR: /e2e
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - pipeline_state:/e2e:ro
    depends_on:
      tax-engine: { condition: service_healthy }

  web-api-tests:
    image: ${DAEJANG_WEB_API_TEST_IMAGE}
    working_dir: /app
    command:
      - /bin/sh
      - -ec
      - |
        npm run test --workspace @daejang/web-api -- src/sources/source-pipeline.e2e.test.ts
        exec npm run test --workspace @daejang/web-api -- src/reviews/review-resolution.e2e.test.ts
    environment:
      RUN_SOURCE_PIPELINE_E2E_TESTS: "1"
      RUN_REVIEW_RESOLUTION_E2E_TESTS: ${RUN_REVIEW_RESOLUTION_E2E_TESTS}
      ALLOW_DOCKER_HOST_E2E: "1"
      DAEJANG_E2E_SUBJECT_ID: ${DAEJANG_E2E_SUBJECT_ID}
      TEST_DATABASE_URL: ${OWNER_DATABASE_URL}
      TEST_WEB_DATABASE_URL: ${WEB_DATABASE_URL}
      TEST_ENGINE_GRPC_TARGET: unix:/run/daejang/engine/engine.sock
      REVIEWROOM_INTERNAL_API_URL: ${REVIEWROOM_INTERNAL_API_URL}
      REVIEWROOM_PROOF_VECTOR_TOKEN: ${REVIEWROOM_PROOF_VECTOR_TOKEN}
      REVIEW_E2E_ANCHOR_CHAIN_ID: ${REVIEW_E2E_ANCHOR_CHAIN_ID}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - engine_socket:/run/daejang/engine:ro
    depends_on:
      engine: { condition: service_started }

  web-api:
    image: ${DAEJANG_WEB_API_CANDIDATE_IMAGE}
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: http://localhost:${DAEJANG_DEV_E2E_WEB_PORT}
      DATABASE_URL: ${WEB_DATABASE_URL}
      RATE_LIMIT_HMAC_SECRET: dev-e2e-rate-limit-secret-only
      SIGNUP_ENABLED: "true"
      EMAIL_AUTH_ENABLED: "true"
      EMAIL_VERIFICATION_DEV_CODE: "000000"
      REPORTS_UI_MODE: product
      UPBIT_PDF_IMPORT_ENABLED: "true"
      ENGINE_GRPC_INSECURE_TARGET: unix:/run/daejang/engine/engine.sock
      PRIVATE_OBJECT_ROOT: /var/lib/daejang/private
      PRIVATE_OBJECT_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      PRIVATE_OBJECT_ENCRYPTION_KEY_ID: dev-e2e-only
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      - engine_socket:/run/daejang/engine:ro
      - private_objects:/var/lib/daejang/private
    depends_on:
      engine: { condition: service_started }

  web-ui:
    image: ${DAEJANG_WEB_UI_CANDIDATE_IMAGE}
    environment:
      VITE_API_PROXY_TARGET: http://web-api:3000
    ports:
      - 127.0.0.1:${DAEJANG_DEV_E2E_WEB_PORT}:5173
    depends_on:
      web-api: { condition: service_healthy }

  # ── ReviewRoom ────────────────────────────────────────────────────────────
  # Only started for the Review run. The API verifies ReviewProofRegistryV2 on
  # chain before it serves anything, so the run brings up its own chain and
  # deploys its own registry; pointing a test at the deployed registry would
  # anchor test proofs into the real proof stream.
  reviewroom-chain:
    profiles: ["review"]
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--silent"]
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 30

  reviewroom-registry:
    profiles: ["review"]
    image: ghcr.io/foundry-rs/foundry:latest
    # Compiles and writes the shared coordinates into fresh named volumes, which
    # start out owned by root.
    user: root
    environment:
      E2E_RPC_URL: http://reviewroom-chain:8545
      REGISTRY_ENV_FILE: /run/reviewroom-chain/chain.env
      REGISTRY_BUILD_DIR: /run/reviewroom-build
    # Inlined rather than mounted from the repository: this file must not bind
    # mount anything out of the checkout, because the checkout may sit under a
    # path Docker Desktop cannot share.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rpc_url=$${E2E_RPC_URL}
        until cast chain-id --rpc-url "$$rpc_url" >/dev/null 2>&1; do sleep 1; done

        # Generated per run and funded from the disposable chain, so no key is
        # committed and none is reused between runs. Read the JSON form: the
        # human-readable output goes to stderr. Nothing here echoes the key.
        wallet=$$(cast wallet new --json)
        key=$$(printf '%s' "$$wallet" | sed -n 's/.*"private_key":"\([^"]*\)".*/\1/p')
        addr=$$(printf '%s' "$$wallet" | sed -n 's/.*"address":"\([^"]*\)".*/\1/p')
        [ -n "$$key" ] && [ -n "$$addr" ] || { echo "no attester key" >&2; exit 1; }
        cast rpc --rpc-url "$$rpc_url" anvil_setBalance "$$addr" 0xde0b6b3a7640000 >/dev/null

        # Compile into the work volume. The contracts are mounted read-only so a
        # run cannot modify the checkout it was given, and the operator does not
        # have to remember to build them first.
        forge build --root /contracts \
          --out /run/reviewroom-build/artifacts \
          --cache-path /run/reviewroom-build/cache >/dev/null
        artifact=/run/reviewroom-build/artifacts/ReviewProofRegistryV2.sol/ReviewProofRegistryV2.json
        bytecode=$$(sed -n 's/.*"bytecode":{"object":"\(0x[^"]*\)".*/\1/p' "$$artifact")
        [ -n "$$bytecode" ] || { echo "no creation bytecode" >&2; exit 1; }

        # Deploy the compiled artifact instead of forge create, which recompiles
        # and writes into the read-only contracts directory.
        args=$$(cast abi-encode 'constructor(address)' "$$addr" | sed 's/^0x//')
        receipt=$$(cast send --json --rpc-url "$$rpc_url" --private-key "$$key" \
          --create "$${bytecode}$${args}")
        registry=$$(printf '%s' "$$receipt" | sed -n 's/.*"contractAddress":"\([^"]*\)".*/\1/p')
        [ -n "$$registry" ] && [ "$$registry" != null ] || { echo "no address" >&2; exit 1; }

        # The API refuses to start unless the attester is allowed.
        cast send "$$registry" 'setAttester(address,bool)' "$$addr" true \
          --rpc-url "$$rpc_url" --private-key "$$key" >/dev/null

        code=$$(cast code "$$registry" --rpc-url "$$rpc_url")
        [ -n "$$code" ] && [ "$$code" != 0x ] || { echo "no runtime code" >&2; exit 1; }

        mkdir -p /run/reviewroom-chain
        {
          echo "CHAIN_RPC_URL=$$rpc_url"
          echo "CHAIN_ID=$$(cast chain-id --rpc-url "$$rpc_url")"
          echo "REVIEW_PROOF_REGISTRY_ADDRESS=$$registry"
          echo "REVIEW_PROOF_REGISTRY_CODE_HASH=$$(cast keccak "$$code")"
          echo "REVIEW_PROOF_REGISTRY_DEPLOYMENT_ID=local-canonical-v2"
          echo "REVIEW_PROOF_REGISTRY_DEPLOYMENT_BLOCK=$$(cast block-number --rpc-url "$$rpc_url")"
          echo "ANCHOR_PRIVATE_KEY=$$key"
        } > /run/reviewroom-chain/chain.env
        echo "registry $$registry deployed"
    volumes:
      - ${DAEJANG_REVIEWROOM_DIR}/contracts:/contracts:ro
      - reviewroom_chain_env:/run/reviewroom-chain
      - reviewroom_build:/run/reviewroom-build
    depends_on:
      reviewroom-chain: { condition: service_healthy }

  reviewroom-postgres:
    profiles: ["review"]
    # ReviewRoom keeps its own database. The canonical Review rows stay in the
    # central disposable database that the other services share.
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: reviewroom
      POSTGRES_USER: reviewroom
      POSTGRES_PASSWORD: reviewroom-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewroom -d reviewroom"]
      interval: 2s
      timeout: 3s
      retries: 30

  reviewroom-migrate:
    profiles: ["review"]
    image: ${DAEJANG_REVIEWROOM_IMAGE}
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      DATABASE_URL: postgres://reviewroom:reviewroom-local-only@reviewroom-postgres:5432/reviewroom?sslmode=disable
    depends_on:
      reviewroom-postgres: { condition: service_healthy }

  reviewroom-api:
    profiles: ["review"]
    image: ${DAEJANG_REVIEWROOM_IMAGE}
    # The registry address and runtime code hash only exist once the contract is
    # deployed, so they arrive as a file rather than as Compose variables.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        . /run/reviewroom-chain/chain.env
        export CHAIN_RPC_URL CHAIN_ID
        export REVIEW_PROOF_REGISTRY_ADDRESS REVIEW_PROOF_REGISTRY_CODE_HASH
        export REVIEW_PROOF_REGISTRY_DEPLOYMENT_ID REVIEW_PROOF_REGISTRY_DEPLOYMENT_BLOCK
        exec node dist/src/index.js
    environment:
      NODE_ENV: production
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8081"
      DATABASE_URL: postgres://reviewroom:reviewroom-local-only@reviewroom-postgres:5432/reviewroom?sslmode=disable
      INTERNAL_API_TOKEN: ${REVIEWROOM_INTERNAL_API_TOKEN}
      RESOLUTION_INGEST_API_TOKEN: ${REVIEWROOM_RESOLUTION_INGEST_TOKEN}
      APPLICATION_RECEIPT_API_TOKEN: ${REVIEWROOM_APPLICATION_RECEIPT_TOKEN}
      PROOF_VECTOR_API_TOKEN: ${REVIEWROOM_PROOF_VECTOR_TOKEN}
      # Must decode to exactly 32 bytes: "reviewroom-local-e2e-commitment!"
      REVIEW_COMMITMENT_KEY_BASE64: cmV2aWV3cm9vbS1sb2NhbC1lMmUtY29tbWl0bWVudCE=
      MAX_RESPONSE_REVISIONS_PER_CASE: "10"
      PROOF_VECTOR_MIN_CONFIRMATIONS: "1"
    ports:
      # The Review suite only accepts a loopback or host.docker.internal origin
      # for ReviewRoom, so the API is reached through a published loopback port
      # rather than by service name.
      - 127.0.0.1:${DAEJANG_DEV_E2E_REVIEWROOM_PORT}:8081
    volumes:
      - reviewroom_chain_env:/run/reviewroom-chain:ro
    depends_on:
      reviewroom-registry: { condition: service_completed_successfully }
      reviewroom-migrate: { condition: service_completed_successfully }

  reviewroom-anchor:
    profiles: ["review"]
    image: ${DAEJANG_REVIEWROOM_IMAGE}
    # Anchors each commitment on the disposable chain. Without it a resolution
    # reaches ReviewRoom but its proof never becomes final, so the Review suite
    # waits for a canonical status that cannot arrive. The signing key comes from
    # the same file as the registry coordinates because the bootstrap generated
    # both together.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        . /run/reviewroom-chain/chain.env
        export CHAIN_RPC_URL CHAIN_ID ANCHOR_PRIVATE_KEY
        export REVIEW_PROOF_REGISTRY_ADDRESS REVIEW_PROOF_REGISTRY_CODE_HASH
        export REVIEW_PROOF_REGISTRY_DEPLOYMENT_ID REVIEW_PROOF_REGISTRY_DEPLOYMENT_BLOCK
        exec node dist/src/worker.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://reviewroom:reviewroom-local-only@reviewroom-postgres:5432/reviewroom?sslmode=disable
      ANCHOR_LEASE_SECONDS: "30"
      ANCHOR_MISSING_TRANSACTION_GRACE_SECONDS: "60"
      ANCHOR_CONFIRMATIONS: "1"
      ANCHOR_POLL_INTERVAL_MS: "250"
    healthcheck:
      disable: true
    volumes:
      - reviewroom_chain_env:/run/reviewroom-chain:ro
    depends_on:
      reviewroom-api: { condition: service_healthy }

  reviewroom-delivery:
    profiles: ["review"]
    image: ${DAEJANG_REVIEWROOM_IMAGE}
    command: ["node", "dist/src/deliveryWorker.js"]
    # Reads REVIEWROOM deliveries from the central disposable database and calls
    # the ReviewRoom API. It holds neither the commitment key nor a chain signer.
    environment:
      NODE_ENV: production
      DAEJANG_DATABASE_URL: ${EVENT_DATABASE_URL}
      REVIEWROOM_INTERNAL_API_URL: http://reviewroom-api:8081
      REVIEWROOM_RESOLUTION_INGEST_TOKEN: ${REVIEWROOM_RESOLUTION_INGEST_TOKEN}
      REVIEWROOM_DELIVERY_ALLOW_INSECURE_HTTP: "true"
      REVIEWROOM_DELIVERY_POLL_INTERVAL_MS: "250"
    # The image healthcheck probes the API endpoint, which this workload does
    # not serve.
    healthcheck:
      disable: true
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      reviewroom-api: { condition: service_healthy }

volumes:
  pdf_parser_socket: {}
  engine_socket: {}
  private_objects: {}
  pipeline_artifacts: {}
  pipeline_state: {}
  reviewroom_chain_env: {}
  reviewroom_build: {}
