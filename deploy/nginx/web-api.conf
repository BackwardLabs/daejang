worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;

  log_format safe_combined
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"-" "$http_user_agent"';
  access_log /var/log/nginx/access.log safe_combined;

  map $http_x_forwarded_for $daejang_client_ip {
    default $http_x_forwarded_for;
    "" $remote_addr;
  }

  limit_req_zone $daejang_client_ip zone=api_general:10m rate=60r/m;
  limit_req_zone $daejang_client_ip zone=auth_siwe:10m rate=10r/m;
  limit_req_zone $daejang_client_ip zone=auth_oauth:10m rate=20r/m;
  limit_req_zone $daejang_client_ip zone=auth_email:10m rate=5r/m;
  limit_req_zone $daejang_client_ip zone=auth_session:10m rate=1r/m;

  upstream daejang_web_api {
    server web-api:3000;
    keepalive 32;
  }

  server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/public-tls-cert.pem;
    ssl_certificate_key /run/secrets/public-tls-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    limit_req_status 429;
    client_max_body_size 1m;
    error_page 429 = @rate_limited;

    location @rate_limited {
      internal;
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header Retry-After "60" always;
      return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.","fieldErrors":[]}}';
    }

    location /api/v1/auth/siwe/ {
      limit_req zone=auth_siwe burst=5 nodelay;
      proxy_pass http://daejang_web_api;
      include /etc/nginx/proxy_params;
    }

    location /api/v1/auth/oauth/ {
      limit_req zone=auth_oauth burst=10 nodelay;
      proxy_pass http://daejang_web_api;
      include /etc/nginx/proxy_params;
    }

    location /api/v1/auth/email/ {
      limit_req zone=auth_email burst=3 nodelay;
      proxy_pass http://daejang_web_api;
      include /etc/nginx/proxy_params;
    }

    location /api/v1/auth/session/ {
      limit_req zone=auth_session burst=2 nodelay;
      proxy_pass http://daejang_web_api;
      include /etc/nginx/proxy_params;
    }

    location /api/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://daejang_web_api;
      include /etc/nginx/proxy_params;
    }

    location ~ ^/api/v1/uploads/[0-9a-f-]+/content$ {
      client_max_body_size 20m;
      limit_req zone=api_general burst=10 nodelay;
      proxy_pass http://daejang_web_api;
      include /etc/nginx/proxy_params;
    }

    location = /healthz {
      proxy_pass http://daejang_web_api;
      include /etc/nginx/proxy_params;
    }

    location / {
      return 404;
    }
  }
}
